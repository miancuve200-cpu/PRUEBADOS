<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grabar Video con Cámara</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { max-width: 900px; margin: 30px auto; padding: 20px; text-align: center; background: #ffffff; }
        h1 { font-size: 2em; margin-bottom: 25px; color: #1f2937; }
        button { padding: 16px 30px; font-size: 1.4em; font-weight: bold; border: none; border-radius: 10px; color: white; cursor: pointer; margin: 8px; width: 90%; max-width: 420px; }
        #btnGrabar { background: #ef4444; }
        #btnParar { background: #6b7280; display: none; }
        #btnGuardar { background: #2563eb; display: none; text-decoration: none; }
        #vistaCamara, #videoFinal { max-width: 100%; border-radius: 10px; margin: 20px auto; display: none; box-shadow: 0 3px 10px rgba(0,0,0,0.15); }
        .aviso { color: #ef4444; font-weight: bold; font-size: 1.3em; margin: 10px 0; display: none; }
    </style>
</head>
<body>

    <h1>📷 Grabar Video</h1>

    <button id="btnGrabar" onclick="iniciarGrabacion()">🔴 EMPEZAR GRABACIÓN</button>
    <div class="aviso" id="textoGrabando">🔴 GRABANDO...</div>
    <video id="vistaCamara" autoplay playsinline muted></video>
    <button id="btnParar" onclick="detenerGrabacion()">⏹️ TERMINAR</button>
    <video id="videoFinal" controls></video>
    <a id="btnGuardar" download="mi_video_grabado.webm">💾 DESCARGAR VIDEO</a>

    <script>
        let flujo = null;
        let grabador = null;
        let datosVideo = [];

        async function iniciarGrabacion() {
            try {
                flujo = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: 640, height: 480 },
                    audio: true
                });

                document.getElementById('vistaCamara').srcObject = flujo;
                document.getElementById('vistaCamara').style.display = 'block';

                datosVideo = [];
                grabador = new MediaRecorder(flujo);
                grabador.ondataavailable = e => { if (e.data.size > 0) datosVideo.push(e.data); };
                grabador.onstop = mostrarVideo;
                grabador.start(100);

                document.getElementById('btnGrabar').style.display = 'none';
                document.getElementById('btnParar').style.display = 'inline-block';
                document.getElementById('textoGrabando').style.display = 'block';

            } catch {
                alert("⚠️ Debes dar permiso a CÁMARA y MICRÓFONO");
            }
        }

        function detenerGrabacion() {
            if (grabador && grabador.state !== 'inactive') grabador.stop();
            if (flujo) flujo.getTracks().forEach(t => t.stop());

            document.getElementById('vistaCamara').style.display = 'none';
            document.getElementById('textoGrabando').style.display = 'none';
            document.getElementById('btnParar').style.display = 'none';
        }

        function mostrarVideo() {
            const archivo = new Blob(datosVideo, { type: 'video/webm' });
            const url = URL.createObjectURL(archivo);
            document.getElementById('videoFinal').src = url;
            document.getElementById('videoFinal').style.display = 'block';
            document.getElementById('btnGuardar').href = url;
            document.getElementById('btnGuardar').style.display = 'inline-block';
        }
    </script>

</body>
</html>

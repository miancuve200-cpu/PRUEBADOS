<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activar Cámara</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            text-align: center;
            background: #f8f9fa;
        }
        h1 { font-size: 2em; margin-bottom: 25px; color: #2c3e50; }
        button {
            padding: 16px 30px;
            font-size: 1.4em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            margin: 10px;
        }
        #btnEncender { background: #16a34a; }
        #btnApagar { background: #ef4444; display: none; }
        #vistaCamara {
            max-width: 100%;
            border-radius: 10px;
            margin: 25px auto;
            display: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <h1>📷 Cámara</h1>

    <button id="btnEncender" onclick="encenderCamara()">✅ Encender Cámara</button>
    <button id="btnApagar" onclick="apagarCamara()">❌ Apagar Cámara</button>

    <video id="vistaCamara" autoplay playsinline muted></video>

    <script>
        let flujoCamara = null;

        async function encenderCamara() {
            try {
                flujoCamara = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: 1280, height: 720 },
                    audio: false
                });
                const camara = document.getElementById('vistaCamara');
                camara.srcObject = flujoCamara;
                camara.style.display = 'block';
                document.getElementById('btnEncender').style.display = 'none';
                document.getElementById('btnApagar').style.display = 'inline-block';
            } catch (error) {
                alert("No se pudo activar la cámara. Revisa los permisos.");
            }
        }

        function apagarCamara() {
            if (flujoCamara) {
                flujoCamara.getTracks().forEach(pista => pista.stop());
            }
            document.getElementById('vistaCamara').style.display = 'none';
            document.getElementById('btnApagar').style.display = 'none';
            document.getElementById('btnEncender').style.display = 'inline-block';
        }
    </script>

</body>
</html>

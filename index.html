<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad: Observa y describe — Matemáticas</title>
    <style>
        * {box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif;}
        body {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
            background-color: #f8f9fa;
            color: #2c3e50;
        }
        .btn-volver {
            display: block;
            margin: 0 auto 25px;
            padding: 10px 25px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
        }
        h1 {text-align: center; font-size: 2.8em; margin-bottom: 10px; font-weight: bold;}
        .subtitulo {text-align: center; color: #666; margin-bottom: 25px; font-size: 1.3em;}
        .btn-audio {
            display: block;
            width: 100%;
            max-width: 700px;
            margin: 0 auto 25px;
            padding: 15px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.4em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-audio:hover {background: #c82333;}
        .imagen-actividad {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: block;
            margin: 0 auto 30px;
        }
        .preguntas {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        .preguntas h3 {margin-bottom: 15px; font-size: 1.5em;}
        .preguntas ol {padding-left: 28px; line-height: 1.9; font-size: 1.2em;}
        .respuesta {
            width: 100%;
            height: 160px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 25px;
        }
        .ejemplo {
            background-color: #e8f4fd;
            padding: 20px;
            border-radius: 8px;
            font-style: italic;
            line-height: 1.6;
        }
        audio {display: none;} /* Ocultamos el reproductor nativo */
    </style>
</head>
<body>

    <!-- Botón Volver al menú -->
    <button class="btn-volver" onclick="history.back()">⬅️ Volver al menú</button>

    <h1>🔢 ACTIVIDAD: OBSERVA Y DESCRIBE</h1>
    <p class="subtitulo">Área: Matemáticas | Fecha: 30 de julio de 2026</p>

    <!-- Botón para activar sonido IGUAL A TU EJEMPLO -->
    <button class="btn-audio" id="botonSonido">🔊 Toca aquí para escuchar toda la actividad</button>

    <!-- Imagen con nombre EXACTO -->
    <img src="MATEMATICAS.jpeg?v=1" alt="Niños trabajando en actividades de matemáticas" class="imagen-actividad">

    <!-- Audio oculto, se reproduce al pulsar el botón -->
    <audio id="audioActividad" preload="auto">
        <source src="toda_la_actividad.mp3" type="audio/mpeg">
        Tu navegador no soporta audio.
    

    <div class="preguntas">
        <h3>🤔 Preguntas guía:</h3>
        <ol>
            <li>¿Quiénes aparecen en la imagen y qué materiales utilizan?</li>
            <li>¿Qué números, formas o cuentas puedes ver?</li>
            <li>¿Qué crees que están calculando o aprendiendo?</li>
            <li>¿Cómo están trabajando: solos, en equipo o con ayuda?</li>
            <li>Escribe 3 oraciones completas describiendo la escena.</li>
        </ol>
    </div>

    <h3>✏️ Tu descripción:</h3>
    <textarea class="respuesta" placeholder="Escribe aquí lo que observas..."></textarea>

    <div class="ejemplo">
        <strong>📖 Ejemplo de respuesta:</strong><br>
        En la imagen hay niños y una maestra realizando actividades de matemáticas. Usan números, figuras y materiales para contar y resolver ejercicios. Están atentos y colaboran para aprender juntos.
    </div>

    <script>
        // Función para reproducir/pausar el audio al hacer clic
        const boton = document.getElementById('botonSonido');
        const audio = document.getElementById('audioActividad');
        boton.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                boton.textContent = '🔊 Reproduciendo... Toca para detener';
            } else {
                audio.pause();
                boton.textContent = '🔊 Toca aquí para escuchar toda la actividad';
            }
        });
    </script>

</body>
</html>
